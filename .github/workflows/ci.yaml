name: PR Compare and Gate to Main

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**/*.py"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  run-pr-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code on PR branch
        run: |
          mkdir -p artifacts
          python scripts/run.py > artifacts/pr-output.txt

      - name: Upload PR output
        uses: actions/upload-artifact@v4
        with:
          name: pr-output
          path: artifacts/pr-output.txt

  run-main-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code on main branch
        run: |
          mkdir -p artifacts
          python scripts/run.py > artifacts/main-output.txt

      - name: Upload main output
        uses: actions/upload-artifact@v4
        with:
          name: main-output
          path: artifacts/main-output.txt

  compare-outputs:
    needs:
      - run-pr-branch
      - run-main-branch
    runs-on: ubuntu-latest

    steps:
      - name: Download PR output
        uses: actions/download-artifact@v4
        with:
          name: pr-output
          path: artifacts/pr

      - name: Download main output
        uses: actions/download-artifact@v4
        with:
          name: main-output
          path: artifacts/main

      - name: Print run.py main() outputs
        run: |
          echo "Output from run.py on main branch:"
          cat artifacts/main/main-output.txt
          echo ""
          echo "Output from run.py on PR branch:"
          cat artifacts/pr/pr-output.txt

      - name: Write job summary
        run: |
          echo "## run.py main() Output" >> $GITHUB_STEP_SUMMARY
          echo "### Main branch" >> $GITHUB_STEP_SUMMARY
          cat artifacts/main/main-output.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PR branch" >> $GITHUB_STEP_SUMMARY
          cat artifacts/pr/pr-output.txt >> $GITHUB_STEP_SUMMARY

  approval:
    needs: compare-outputs
    runs-on: ubuntu-latest
    environment:
      name: main-merge-approval

    steps:
      - name: Await manual approval
        run: echo "Waiting for human validation to merge into main"
