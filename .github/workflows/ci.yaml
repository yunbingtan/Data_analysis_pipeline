name: PR Compare and Gate to Main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  run-pr-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code on PR branch
        run: |
          mkdir -p artifacts
          python run.py > artifacts/pr-output.txt

      - name: Upload PR output
        uses: actions/upload-artifact@v4
        with:
          name: pr-output
          path: artifacts/pr-output.txt

  run-main-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code on main branch
        run: |
          mkdir -p artifacts
          python run.py > artifacts/main-output.txt

      - name: Upload main output
        uses: actions/upload-artifact@v4
        with:
          name: main-output
          path: artifacts/main-output.txt

  compare-outputs:
    needs:
      - run-pr-branch
      - run-main-branch
    runs-on: ubuntu-latest

    steps:
      - name: Download PR output
        uses: actions/download-artifact@v4
        with:
          name: pr-output
          path: artifacts/pr

      - name: Download main output
        uses: actions/download-artifact@v4
        with:
          name: main-output
          path: artifacts/main

      - name: Compare outputs
        run: |
          mkdir -p comparison
          if diff -u artifacts/main/main-output.txt artifacts/pr/pr-output.txt > comparison/diff.txt; then
            echo "Outputs match." > comparison/summary.txt
          else
            echo "Outputs differ. See diff.txt for details." > comparison/summary.txt
            exit 1
          fi

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-report
          path: comparison/

      - name: Write job summary
        if: always()
        run: |
          echo "## Output Comparison" >> $GITHUB_STEP_SUMMARY
          cat comparison/summary.txt >> $GITHUB_STEP_SUMMARY

  approval:
    needs: compare-outputs
    runs-on: ubuntu-latest
    environment:
      name: main-merge-approval

    steps:
      - name: Await manual approval
        run: echo "Waiting for human validation to merge into main"

  merge-to-main:
    needs: approval
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Merge PR after approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch
